name: Check the card

# The card is plain JavaScript with one test file, so this runs what npm run check
# runs. It lives here rather than on GitHub because GitHub only ever receives what
# this repository publishes to it. Should the card ever grow dependencies, an
# install step has to come before the check.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and tests
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Syntax check and tests
        run: |
          node --check ha_energy-tile-card.js
          node tests/card.test.mjs
