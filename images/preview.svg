<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510">
  <rect width="900" height="510" rx="28" fill="#101820"/>
  <text x="48" y="62" fill="#f2f5f8" font-family="Arial, sans-serif" font-size="26" font-weight="700">Energy Tile Card</text>
  <!--
    Every row carries a ring instead of an icon. The ring shows the share of the
    whole house consumption and starts where the previous row ended, so the
    three rings together draw one circle.
    Geometry: center (50 47), radius 18, angle measured from the top, clockwise.
  -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(48 92)">
      <rect width="804" height="118" rx="18" fill="#202b35"/>
      <circle cx="50" cy="47" r="18" fill="none" stroke="#3b4650" stroke-width="10"/>
      <path d="M 50 29 A 18 18 0 1 1 44.44 64.12" fill="none" stroke="#03a9f4" stroke-width="10"/>
      <text x="92" y="46" fill="#f2f5f8" font-size="21" font-weight="700">Heat pump</text>
      <text x="92" y="72" fill="#aeb9c4" font-size="16">Basement · 55% of the house</text>
      <text x="742" y="52" text-anchor="end" fill="#f2f5f8" font-size="21" font-weight="700">17.60 kWh</text>
      <text x="742" y="78" text-anchor="end" fill="#aeb9c4" font-size="16">4.54 CHF</text>
    </g>
    <g transform="translate(48 226)">
      <rect width="804" height="118" rx="18" fill="#202b35"/>
      <circle cx="50" cy="47" r="18" fill="none" stroke="#3b4650" stroke-width="10"/>
      <path d="M 50 29 A 18 18 0 1 1 44.44 64.12" fill="none" stroke="#03a9f4" stroke-width="10" opacity="0.25"/>
      <path d="M 44.44 64.12 A 18 18 0 0 1 32.14 49.26" fill="none" stroke="#03a9f4" stroke-width="10"/>
      <text x="92" y="46" fill="#f2f5f8" font-size="21" font-weight="700">Server rack</text>
      <text x="92" y="72" fill="#aeb9c4" font-size="16">Cellar · 18% of the house</text>
      <text x="742" y="52" text-anchor="end" fill="#f2f5f8" font-size="21" font-weight="700">5.80 kWh</text>
      <text x="742" y="78" text-anchor="end" fill="#aeb9c4" font-size="16">1.50 CHF</text>
    </g>
    <g transform="translate(48 360)">
      <rect width="804" height="118" rx="18" fill="#202b35"/>
      <circle cx="50" cy="47" r="18" fill="none" stroke="#3b4650" stroke-width="10"/>
      <path d="M 50 29 A 18 18 0 1 1 44.44 64.12" fill="none" stroke="#03a9f4" stroke-width="10" opacity="0.25"/>
      <path d="M 44.44 64.12 A 18 18 0 0 1 32.14 49.26" fill="none" stroke="#03a9f4" stroke-width="10" opacity="0.25"/>
      <path d="M 32.14 49.26 A 18 18 0 0 1 50 29" fill="none" stroke="#aeb9c4" stroke-width="10" opacity="0.5"/>
      <text x="92" y="46" fill="#aeb9c4" font-size="21">Not captured consumption</text>
      <text x="92" y="72" fill="#8b97a3" font-size="16">27% of the house</text>
      <text x="742" y="52" text-anchor="end" fill="#f2f5f8" font-size="21" font-weight="700">8.60 kWh</text>
      <text x="742" y="78" text-anchor="end" fill="#aeb9c4" font-size="16">2.22 CHF</text>
    </g>
  </g>
</svg>
